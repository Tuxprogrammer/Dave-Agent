mc:
  # tuxmine: off, because UILib's Angelica/Iris font path crashes with shader packs (Iris program unknown attribute iris_Entity). Players may change it.
  replaceVanillaFont: false
font:
  # 完整有序字体候选：builtin:<内置来源id> 或 file:<字体路径>；空列表不追加默认字体。
  candidates:
  - builtin:unifont
  - builtin:noto-arabic
  - builtin:noto-devanagari
  - builtin:noto-thai
  - builtin:noto-color-emoji
  - builtin:noto-emoji-text
  - builtin:noto-bengali
  - builtin:noto-gurmukhi
  - builtin:noto-gujarati
  - builtin:noto-oriya
  - builtin:noto-tamil
  - builtin:noto-telugu
  - builtin:noto-kannada
  - builtin:noto-malayalam
  - builtin:noto-sinhala
  - builtin:noto-symbols
ui:
  # UILib全局主题：light（浅色）或dark（深色）；应用后生效，保存后重启保留。
  theme: light
  # UILib全局滚轮距离：每单位滚轮输入移动的像素数，须为正整数；应用或文件重载后生效，保存后重启保留。节点显式scrollStep优先。
  scrollStep: 60
render:
  # 激进合批默认关闭；可能改变重叠文字、阴影和透明图元的覆盖顺序，设置页应用或文件重载后生效。
  aggressiveBatching: false
