general:
  # How shall I greet?
  greeting: Hello World
  # 连锁范围半径（方盒子半径，搜索顺序仍为中心扩散）
  chainRadius: 8.0
  # 最大连锁数量；超大值（如 >65536）会显著拖慢规划并加剧 abort 频率，建议根据机器性能调整
  chainMaxBlocks: 512.0
  # CHAIN 伐木子模式每次向外扩展的壳层数；1 表示围绕当前原木检查一圈 3x3x3 邻域
  chainLoggingShellLayers: 1.0
  # GT 线缆连锁替换单 tick 原子上限；超过此值的链路预校验失败不放行（防电压不匹配爆炸）；默认 1024
  cableReplaceMaxPerTick: 1024.0
  # 连锁看门狗超时阈值（tick）：玩家连锁 N tick 无真实工作推进则协作式回 IDLE（异常兜底，默认 50 ≈ 2.5 秒）
  chainWatchdogTimeoutTicks: 50.0
  # planning、preview 与普通执行共享的每 Tick soft deadline（毫秒）；默认 15，可配置 1..40
  tickBudgetMs: 15.0
  # 是否解除 GT/BW/GT++ 普通矿的 3 级时运上限；关闭时保持原版逻辑
  enableUnlimitedOreFortune: false
  # 是否允许非自然生成的 GT/BW 矿石也享受时运；关闭时保持原版仅自然矿可时运
  enableFortuneForPlacedOre: false
  # 并行执行预算档位：deadline 沿用 tickBudgetMs 共享 deadline（默认，等于现状）；slice 改为每 tick 独立分片预算，主线程不再等满 deadline
  parallelBudgetMode: deadline
  # slice 档每 tick 的并行分片预算（毫秒），合法 1..40；deadline 档不生效
  parallelSliceBudgetMs: 4.0
  # 连锁/爆破每成功破坏一个方块消耗的饥饿值（原版 exhaustion 单位），按实测增量覆盖成该值：0.025 等于原版每方块消耗（默认，逐值等于现状），0 表示完全不消耗，负值表示净回补；合法 -40..40，40 等于原版 exhaustion 累加上限、-40 与之对称。覆写 harvestBlock 的方块同样生效；exhaustion 接近 40 上限时会被截断
  harvestExhaustionPerBlock: 0.025
client:
  # 是否启用客户端连锁预览计算与渲染；关闭后将不再执行任何预览相关渲染操作
  clientEnablePreviewRender: true
  # look_direction 按视线主轴；hit_face 按命中面向方块内部
  tunnelDirectionSource: look_direction
  # 是否启用自动工具换位；关闭时安全还原已有换位
  autoToolSwapEnabled: true
  # 有序工具选择器：namespace:path@subtype、namespace:path@* 或 ore:name
  autoToolPrioritySelectors: []
  # 客户端最大预览半径；实际预览范围取该值与 chainRadius 的较小值
  clientPreviewMaxRadius: 16.0
  # 客户端最大预览目标数量；实际预览数量取该值与服务端 chainMaxBlocks 的较小值
  clientPreviewMaxTargets: 1024.0
  # 客户端预览透明度开始衰减的距离半径
  clientPreviewAlphaFadeStartRadius: 2.0
  # 客户端预览透明度衰减到最低值的距离半径
  clientPreviewAlphaFadeEndRadius: 6.0
  # 客户端预览透明度的起始值
  clientPreviewAlphaStartValue: 0.78
  # 客户端预览透明度的结束值
  clientPreviewAlphaEndValue: 0.15
  # 预览渲染后端：auto 能力探测通过用 shader、否则 legacy（默认）；shader 档探测失败仍回退 legacy 并记录诊断；legacy 恒为固定管线
  clientPreviewRenderBackend: auto
  # 预览条柱粗细（方块坐标偏移缩放），默认 0.045，合法 0.005..0.2
  clientPreviewBarThickness: 0.045
  # 预览颜色来源：builtin 内置六色（默认，按大模式区分）；config 使用下方六个 RGB 键的语义配色
  clientPreviewColorSource: builtin
  # CHAIN 大模式（默认子模式）本地预测颜色（0xRRGGBB），默认 0x40E6FF
  clientPreviewColorChain: 4253439.0
  # AREA 大模式（默认子模式）本地预测颜色（0xRRGGBB），默认 0xE8503C
  clientPreviewColorArea: 1.5224892E7
  # INTERACT 大模式（默认子模式）本地预测颜色（0xRRGGBB），默认 0x58E07A
  clientPreviewColorInteract: 5824634.0
  # 扩展子模式本地预测颜色（0xRRGGBB），默认 0xB08CFF
  clientPreviewColorSecondary: 1.1570431E7
  # 远端预测颜色（0xRRGGBB），默认 0x8FA9D0
  clientPreviewColorRemote: 9415120.0
  # 截断目标颜色（0xRRGGBB），默认 0xF8C858
  clientPreviewColorTruncated: 1.6304216E7
  # 深度通道：xray 恒可见（默认，等于现状）；occlude 参与深度测试；outline 主体遮挡 + 置顶轮廓；depthOpaque 可见部分不透明、遮挡部分保留距离透明度，均保留动画过渡
  clientPreviewDepthMode: xray
  # 预览动画：off 关闭（默认，等于本轮基线）；flow 整体流动；wave 按出现顺序逐波生长（接线属下一批）
  clientPreviewAnimation: 'off'
  # 单代动画时长（毫秒），0 表示瞬时完成，合法 0..2000
  clientPreviewAnimationDurationMs: 120.0
  # 动画相位来源：order 用出现序号（默认）；hash 用坐标 + 代次稳定哈希（预留档：本轮未接线，改此键观感不变）
  clientPreviewAnimationPhase: order
  # 距离淡出刷新：timer 1 Hz 兜底（默认，等于现状）；signal 相机变更信号驱动（接线属下一批）；gpu 由着色器逐帧计算
  clientPreviewFadeMode: timer
  # signal 档相机位移阈值（格）：位移达到该值才提升 visual revision，合法 0..8
  clientPreviewFadeRefreshDistance: 0.5
  # signal 档无位移时的兜底刷新间隔（毫秒），合法 50..5000
  clientPreviewFadeFallbackMs: 250.0
  # 条柱在屏幕上的最小宽度（像素），0 表示不钳制（默认，等于现状）、1..8 生效，合法 0..8；着色器后端按该值单向钳制条柱屏幕宽度
  clientPreviewMinScreenWidthPx: 0.0
  # 描边壳沿面方向的外扩宽度（物理像素），默认 1.5（等于接线前写死值，观感不变）、0 表示关闭描边，合法 0..8；仅着色器后端的 outline 深度档消费
  clientPreviewOutlineWidthPx: 1.5
  # 是否按面朝向烘焙明暗（顶面最亮、底面最暗），默认 false（等于接线前观感）；开启后 legacy 颜色流与着色器顶点色使用同一张亮度表
  clientPreviewFaceShading: true
  # 预览被目标上限截断时是否给出可见提示（默认 false；HUD 文案接线属下一批）
  clientPreviewTruncationSignal: false
  # 预览目标数量硬顶，合法 1..4096；实际取该值与 clientPreviewMaxTargets、服务端 chainMaxBlocks 的较小值。配额按唯一坐标去重后占用，HUD 的预览已匹配仍是含重复的原始读取数
  clientPreviewMaxTargetsHardCap: 4096.0
  # 极端规模 LOD：off 关闭（默认，等于历史行为）；auto 按距离合并并做 alpha 剔除
  clientPreviewLod: 'off'
  # LOD alpha 剔除阈值：低于该值的条柱不参与构建，合法 0..1
  clientPreviewLodMinAlpha: 0.05
  # 连锁序亮度权重下限：预览集合里序号最大（离瞄准起点最远）的条柱乘的亮度权重，合法 0..1；1.0 关闭本能力（等于现状），默认 0.55 时起点 1.0、最远 0.55；只乘颜色亮度，不影响由距离淡出决定的 alpha
  clientPreviewOrderMinBrightness: 0.55
  # 内部结构亮度系数：预览里内部格线（junction 补块 / 共享顶点，无贯通面槽位的顶点）乘的颜色亮度，合法 0..1；1.0 关闭本能力（等于现状），默认 0.65 时内部格线为原亮度的 65%，外轮廓（贯通管面）保持 1.0；只压暗颜色亮度，不影响 alpha，也不作用于描边 pass（描边色即外轮廓）
  clientPreviewInteriorDim: 0.65
  # 预览激活且瞄准同一目标时取消原版方块高亮，避免双重指示
  clientPreviewSuppressVanillaHighlight: false
  # 是否使用版本化预览输入快照（含目标去抖），默认 false（接线属下一批）；关闭时走逐字段比较
  clientPreviewVersionedInputs: false
  # 是否启用统一表现投影覆盖层（HUD 截断 / 进度 / 远端失败的单一事实源）
  clientPreviewPresentationOverlay: false
  # 是否在 HUD 展示执行进度（已执行 / 匹配）；进度由客户端世界采样得到，默认关闭
  clientPreviewExecutionProgress: false
  # 是否在 HUD 展示预览后端诊断（当前生效后端与一次性回退原因）；默认关闭
  clientPreviewBackendDiagnostics: false
  # 远端预览请求超时（毫秒），合法 250..60000；超时丢弃陈旧响应并清预览激活
  clientPreviewRemoteTimeoutMs: 5000.0
  # 按组标识和适用模式组织连锁挖掘对象
  objectGroups:
  - id: 红石矿石
    modes:
    - chain_base
    - chain_ore
    - area_same_block
    - area_ore
    members:
    - minecraft:redstone_ore@*
    - minecraft:lit_redstone_ore@*
    - etfuturum:deepslate_redstone_ore@*
    - etfuturum:deepslate_lit_redstone_ore@*
  - id: 暮色森林极光方块
    modes:
    - chain_base
    - chain_ore
    - area_same_block
    - area_ore
    members:
    - TwilightForest:tile.TFAuroraBrick@*
  # 显示 Miner 状态 HUD
  hudEnabled: true
  # HUD 相对屏幕的锚点
  hudAnchor: TOP_LEFT
  # HUD 水平逻辑偏移
  hudOffsetX: 12.0
  # HUD 垂直逻辑偏移
  hudOffsetY: 12.0
  # HUD 内容缩放
  hudScale: 1.0
