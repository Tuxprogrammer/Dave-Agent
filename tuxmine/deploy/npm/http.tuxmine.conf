# --- tuxmine pack host (pack.example.net, NPM proxy host 54) -------------------------
# Appended to /data/nginx/custom/http.conf on store (http level). Like the ai_* zones above
# it, this enforces nothing by itself: host 54's Advanced config (advanced.conf next to this
# file in Dave-Agent/tuxmine/deploy/npm/) applies the limits.
#
# LAN, docker and tailnet clients map to an empty key, and nginx never limits an empty key,
# so they skip every limit. Outside clients (US-only via gw's port forward) get:
#   - pack files: 10 requests/s per IP, burst 60 (a first packwiz sync is ~10 requests)
#   - instance zips: 1 download at a time per IP, 3 at a time in total, 3 per minute per IP
#     (burst 2), each at 25 MB/s. Zips can never take more than ~600 Mbit/s of the uplink.
# To change the caps, edit the numbers here and in advanced.conf, then `nginx -t` and reload.

geo $tuxmine_lan {
    default                  0;
    10.0.0.0/8               1;
    172.16.0.0/12            1;   # docker bridges on store
    100.64.0.0/10            1;   # tailnet
    fd00::/8                 1;   # ULA (fd10::/64 LAN)
    2605:a601:a88c:3300::/56 1;   # our own IPv6 delegation
}
map $tuxmine_lan $tuxmine_ip {
    0       $binary_remote_addr;
    default "";
}
map "$tuxmine_lan:$uri" $tuxmine_zip_ip {
    "~^0:.*\.zip$" $binary_remote_addr;
    default        "";
}
map $tuxmine_zip_ip $tuxmine_zip_all {
    ""      "";
    default "all";
}
map $tuxmine_zip_ip $tuxmine_rate {
    ""      0;
    default 25m;
}
limit_req_zone  $tuxmine_ip      zone=tuxmine_req:10m     rate=10r/s;
limit_req_zone  $tuxmine_zip_ip  zone=tuxmine_zip_req:10m rate=3r/m;
limit_conn_zone $tuxmine_zip_ip  zone=tuxmine_zip_ip:10m;
limit_conn_zone $tuxmine_zip_all zone=tuxmine_zip_all:1m;
# --- end tuxmine ---------------------------------------------------------------------
