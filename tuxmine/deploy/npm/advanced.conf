# pack.example.net: Nginx Proxy Manager "Advanced" tab for proxy host 54 (server level).
# Zones and maps live in /data/nginx/custom/http.conf (http.tuxmine.conf in Dave-Agent/tuxmine/deploy/npm/).
# LAN/docker/tailnet clients have empty keys and are never limited. Over a limit is a 429, set
# here (server level) so it doesn't depend on anything else in http.conf.
# --- rate limiting ---
limit_req_status  429;
limit_conn_status 429;
limit_req  zone=tuxmine_req     burst=60 nodelay;
limit_req  zone=tuxmine_zip_req burst=2  nodelay;
limit_conn tuxmine_zip_ip  1;
limit_conn tuxmine_zip_all 3;
limit_rate $tuxmine_rate;
# --- end rate limiting ---
